<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d1a">
<title>Night-sky calendars</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a short heading over two link cards, centred on the page; the cards sit side by side when there's room. */
:root { color-scheme: dark; --bg: #070d1a; --panel: rgba(147, 160, 181, 0.07); --line: rgba(147, 160, 181, 0.26); --ink: #e3e9f2; --soft: #93a0b5; --accent: #5fd0dc; }
html, body { min-height: 100%; margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: max(12vh, 48px) 20px 48px; }
h1 { margin: 0 0 6px; font: 600 26px/1.2 "IBM Plex Sans", system-ui, sans-serif; }
p { margin: 0; color: var(--soft); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 28px; }
a.card { display: block; padding: 18px 18px 20px; color: inherit; text-decoration: none; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; transition: border-color 0.15s, background 0.15s; }
a.card:hover, a.card:focus-visible { border-color: var(--accent); background: rgba(95, 208, 220, 0.07); outline: none; }
.card b { display: block; margin-bottom: 4px; font: 600 15px "IBM Plex Mono", ui-monospace, Menlo, monospace; color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Night-sky calendars</h1>
  <p>Year-long charts of what is up, night by night, for wherever you are. Each opens into a view of the sky overhead.</p>
  <div class="cards">
    <a class="card" href="messier/"><b>Messier Calendar</b><p>When each of the 110 Messier objects is highest in the night sky.</p></a>
    <a class="card" href="planets/"><b>Planet Calendar</b><p>When each planet rises, is highest and sets.</p></a>
  </div>
</main>
</body>
</html>
